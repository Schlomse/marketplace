name: Build catalog

# Rebuilds index.json whenever the plugins tree changes on main — i.e. right
# after a submission PR is merged. The RelateCore app reads index.json through
# the jsDelivr CDN, so this commit is what makes a plugin "go live".

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - 'scripts/build-catalog.mjs'
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild index.json
        run: node scripts/build-catalog.mjs

      - name: Commit catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "relatecore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
            exit 0
          fi
          git commit -m "chore: rebuild marketplace catalog"
          # Branch protection requires the "Validate submissions" context on
          # every push to main. The catalog commit doesn't touch plugins/ (and
          # its content was already validated on the merged submission PR), so
          # self-report the check for this generated commit before pushing.
          gh api "repos/${{ github.repository }}/check-runs" \
            -F name="Validate submissions" \
            -F head_sha="$(git rev-parse HEAD)" \
            -F status=completed \
            -F conclusion=success
          git push
